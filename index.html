<html lang="en-GB">

<style>
:root{
  --blue:#05214c; --reflex:#000898; --yellow:#fab31e; --ink:#0a0e1a; --ink-soft:#4a5160;
  --paper:#ffffff; --warm:#f7f6f2; --rule:#d9dde3; --rule-strong:#b6bcc6; --chip:#eef0f4;
  --pend-bg:#fff4d6; --pend:#6b4700; --ok-bg:#e2f0e6; --ok:#1b5130; --no-bg:#f9e3e5; --no:#8a1c2b;
  --hours:#a9c4e8; --absent:#808d9a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--warm);color:var(--ink);font-family:"Gill Sans Nova","Gill Sans MT","Gill Sans","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--blue)} a:hover{color:var(--reflex)}
button,input,select,textarea{font:inherit}
header.top{background:var(--blue);color:#fff}
.top-inner{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.brand small{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#c9d1de}
.brand span{font-size:24px;font-weight:500}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:#fff;padding:10px 12px;cursor:pointer;font-size:15px}
nav.tabs button[aria-current="page"]{border-bottom-color:var(--yellow)}
.who{font-size:14px;color:#c9d1de}
.who button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;font-size:14px;padding:4px}
main{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
.narrow{max-width:560px}
h1{margin:0 0 6px;font-size:32px;font-weight:500;color:var(--blue);line-height:1.15}
h2{margin:0 0 10px;font-size:20px;font-weight:500;color:var(--blue)}
.muted{color:var(--ink-soft)} .small{font-size:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.card{background:#fff;border:1px solid var(--rule);padding:22px;margin-bottom:16px}
.big{font-size:48px;font-weight:500;line-height:1.1;color:var(--blue)}
.bar{display:flex;height:12px;background:var(--chip);margin:10px 0}
.bar .a{background:var(--blue)} .bar .p{background:repeating-linear-gradient(135deg,#9fb0cc 0 4px,#c9d3e3 4px 8px)}
.key{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:14px;color:var(--ink-soft)}
.key i{width:10px;height:10px;display:inline-block}
.btn{display:inline-block;font-size:15px;padding:12px 18px;border:1px solid var(--rule-strong);background:#fff;color:var(--blue);cursor:pointer;text-align:center;text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn.wide{width:100%;font-size:17px;padding:14px}
.btn.small{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btnrow .btn{flex:1 1 140px}
.list .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.list .item:last-child{border-bottom:1px solid var(--rule)}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.pending{background:var(--pend-bg);color:var(--pend)} .chip.approved{background:var(--ok-bg);color:var(--ok)}
.chip.declined{background:var(--no-bg);color:var(--no)} .chip.cancelled{background:var(--chip);color:var(--ink-soft)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;background:var(--chip);color:var(--ink-soft);border-radius:2px;margin-top:4px}
.tag.warn{background:var(--pend-bg);color:var(--pend)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.banner{padding:12px 16px;background:var(--pend-bg);color:var(--pend);margin-bottom:16px}
.error{padding:12px 16px;background:var(--no-bg);color:var(--no);margin-bottom:16px}
.cols{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.cols>.main{flex:999 1 560px;min-width:0} .cols>.side{flex:1 1 300px}
.req{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
.req .info{display:flex;flex-direction:column;gap:2px;min-width:240px}
.req .title{font-size:19px;color:var(--blue)}
fieldset{border:1px solid var(--rule);padding:12px 14px;margin:12px 0 0}
legend{padding:0 6px;font-weight:500;color:var(--blue)}
label.radio{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
label.radio input{margin-top:4px;width:18px;height:18px;accent-color:var(--blue)}
dialog{border:0;padding:0;max-width:520px;width:calc(100% - 32px);box-shadow:0 24px 48px -16px rgba(5,33,76,.18)}
dialog::backdrop{background:rgba(5,33,76,.4)}
.dlg{padding:24px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.field label{font-weight:500}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink)}
.field .hint{font-size:14px;color:var(--ink-soft)}
.row2{display:flex;gap:12px;flex-wrap:wrap}.row2>.field{flex:1 1 180px}
.check{display:flex;gap:8px;align-items:center;margin:6px 0}
.check input{width:18px;height:18px;accent-color:var(--blue)}
table.data{width:100%;border-collapse:collapse;font-size:15px}
table.data th,table.data td{text-align:left;padding:8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.data th{font-size:13px;color:var(--ink-soft);font-weight:600}
.scroll{overflow-x:auto}
.cal{display:grid;gap:3px;align-items:center;min-width:900px}
.cal .hd{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink-soft)}
.cal .hd b{font-size:15px;color:var(--ink);font-weight:400}
.cal .nm{font-size:15px;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{height:34px;background:#fff;border:1px solid #e6e9ee}
.c-term{background:#fbfaf7}
.c-leave{background:var(--blue);border-color:var(--blue)}
.c-pending{background:repeating-linear-gradient(135deg,#9fb0cc 0 4px,#c9d3e3 4px 8px);border-color:#9fb0cc}
.c-half{background:linear-gradient(to bottom,var(--blue) 0 50%,#fff 50% 100%);border-color:var(--blue)}
.c-hours{background:var(--hours);border-color:var(--hours)}
.c-absent{background:var(--absent);border-color:var(--absent)}
.c-bh{background:repeating-linear-gradient(45deg,#eef0f4 0 3px,#dde1e7 3px 6px);border-color:#dde1e7}
.c-flex{box-shadow:inset 0 -8px 0 var(--yellow)}
.legend span{display:inline-flex;align-items:center;gap:8px;margin:0 18px 8px 0;font-size:14px;color:var(--ink-soft)}
.legend i{width:16px;height:16px;display:inline-block;border:1px solid #e6e9ee}
.hidden{display:none!important}
@media (max-width:600px){ h1{font-size:28px} .big{font-size:42px} main{padding:20px 16px 48px} }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><small>King's College School</small><span>Time off</span></div>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
    <div class="who" id="who"></div>
  </div>
</header>
<main id="app"><p class="muted">Loading...</p></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
// ============================================================
// Settings: paste your project's details here (see SETUP.md)
// ============================================================
const SUPABASE_URL = 'https://zpwerwzekpbnulhgjkvt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_n4j5lYRyyjm-o6FkJiKhaw_FOVMU2Tq';
const ALLOWED_EMAIL_DOMAIN = 'kcs.org.uk';   // sign-in links are only offered to this domain

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'timeoff' } });

// ============================================================
// Small helpers
// ============================================================
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (n) => { n = Number(n) || 0; return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100); };
const plural = (n, one, many) => num(n) + ' ' + (Number(n) === 1 ? one : many);
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const toDate = (iso) => new Date(iso + 'T12:00:00Z');
const iso = (d) => d.toISOString().slice(0, 10);
const todayIso = () => { const d = new Date(); return iso(new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 12))); };
const addDays = (s, n) => { const d = toDate(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const ord = (n) => n + ([11,12,13].includes(n) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th'));
function fmtDate(s, withYear) {
  const d = toDate(s);
  return DAYS[d.getUTCDay()] + ' ' + ord(d.getUTCDate()) + ' ' + MONTHS[d.getUTCMonth()] + (withYear ? ' ' + d.getUTCFullYear() : '');
}
function fmtRange(a, b) {
  if (a === b) return fmtDate(a);
  return fmtDate(a) + ' to ' + fmtDate(b);
}
const leaveYear = (s) => { const d = toDate(s); return d.getUTCMonth() >= 7 ? d.getUTCFullYear() : d.getUTCFullYear() - 1; };
const yearLabel = (y) => y + '-' + String((y + 1) % 100).padStart(2, '0');
const isWeekday = (s) => { const w = toDate(s).getUTCDay(); return w > 0 && w < 6; };

// ============================================================
// State
// ============================================================
const S = {
  me: null, view: 'home', month: null,
  staff: [], links: [], requests: [], hours: [], sickness: [], adjustments: [], decisions: [],
  terms: [], bankHolidays: [], directory: [], names: [], acting: new Map(), error: null
};
const byId = (id) => S.staff.find(p => p.id === id);
const nameOf = (id) => byId(id)?.full_name || (S.directory.find(p => p.id === id)?.full_name) || (S.names.find(p => p.id === id)?.full_name) || 'Someone';
const isBH = (s) => S.bankHolidays.some(b => b.day === s);
const isTermDay = (s) => S.terms.some(t => s >= t.starts && s <= t.ends);
function workingDays(a, b, part) {
  if (!a || !b || b < a) return 0;
  if (a === b && part !== 'full') return (isWeekday(a) && !isBH(a)) ? 0.5 : 0;
  let n = 0; for (let d = a; d <= b; d = addDays(d, 1)) if (isWeekday(d) && !isBH(d)) n++;
  return n;
}
const LIVE = ['pending','under_discussion','approved','cancel_requested'];
const KIND = { annual_leave: 'Annual leave', kit: 'Keeping in touch day', term_off: 'Time off in term', flex: 'One-off flex' };
function statusChip(st) {
  const map = { pending: ['pending','Pending'], under_discussion: ['pending','Pending'], approved: ['approved','Approved'],
    declined: ['declined','Declined'], cancelled: ['cancelled','Cancelled'], cancel_requested: ['pending','Cancellation pending'] };
  const [c, t] = map[st] || ['cancelled', st];
  return `<span class="chip ${c}">${t}</span>`;
}

// Who I approve for (including as a deputy) comes from the server
const actingFor = (staffId) => S.acting.get(staffId) || null;
function myTeam() {
  if (S.me.is_admin) return S.staff.filter(p => p.active && p.id !== S.me.id);
  const ids = new Set(S.links.filter(l => l.other_id === S.me.id).map(l => l.staff_id));
  S.staff.forEach(p => { if (p.id !== S.me.id && actingFor(p.id)) ids.add(p.id); });
  return S.staff.filter(p => ids.has(p.id) && p.active);
}

// ============================================================
// Allowances and pace
// ============================================================
function adj(staffId, yr, kind) {
  return S.adjustments.filter(a => a.staff_id === staffId && a.leave_year === yr && a.kind === kind)
    .reduce((t, a) => t + Number(a.amount), 0);
}
function leaveSummary(p, yr) {
  const allowance = Number(p.leave_days) + adj(p.id, yr, 'leave_days');
  const reqs = S.requests.filter(r => r.staff_id === p.id && r.kind === 'annual_leave' && leaveYear(r.start_date) === yr && LIVE.includes(r.status));
  const approved = reqs.filter(r => r.status === 'approved' || r.status === 'cancel_requested').reduce((t, r) => t + Number(r.days), 0);
  const waiting = reqs.filter(r => r.status === 'pending' || r.status === 'under_discussion').reduce((t, r) => t + Number(r.days), 0);
  return { allowance, approved, waiting, booked: approved + waiting, left: allowance - approved - waiting };
}
function hoursSummary(p, yr) {
  const target = Number(p.extra_hours) + adj(p.id, yr, 'extra_hours');
  const rows = S.hours.filter(h => h.staff_id === p.id && leaveYear(h.work_date) === yr);
  const approved = rows.filter(h => h.status === 'approved').reduce((t, h) => t + Number(h.hours), 0);
  const waiting = rows.filter(h => h.status === 'pending').reduce((t, h) => t + Number(h.hours), 0);
  return { target, approved, waiting, logged: approved + waiting, left: Math.max(0, target - approved - waiting) };
}
// Fraction of the year (from 1st August) that has passed
function yearFraction(yr) {
  const start = Date.UTC(yr, 7, 1), end = Date.UTC(yr + 1, 7, 1), now = toDate(todayIso()).getTime();
  return Math.min(1, Math.max(0, (now - start) / (end - start)));
}
// Matter-of-fact pace: projected position counts anything already booked
function pace(used, total, yr) {
  if (!total) return 'On track';
  const f = yearFraction(yr), expected = total * f;
  const monthsIn = Math.floor(f * 12);
  if (used > expected + total * 0.25) return 'Ahead of pace';
  if (monthsIn >= 6 && used < expected * 0.5) return 'Behind pace';
  return 'On track';
}

// ============================================================
// Loading data
// ============================================================
async function loadAll() {
  const q = (t, order) => sb.from(t).select('*').order(order || 'id');
  const res = await Promise.all([
    q('staff', 'full_name'), q('links'), q('requests', 'start_date'), q('hours_entries', 'work_date'),
    q('sickness', 'start_date'), q('adjustments'), q('decisions'), q('term_dates', 'starts'), q('bank_holidays', 'day')
  ]);
  const err = res.find(r => r.error);
  if (err) throw err.error;
  [S.staff, S.links, S.requests, S.hours, S.sickness, S.adjustments, S.decisions, S.terms, S.bankHolidays] = res.map(r => r.data);
  const [ac, nm] = await Promise.all([sb.rpc('my_acting'), sb.rpc('colleague_names')]);
  if (ac.error) throw ac.error;
  S.acting = new Map((ac.data || []).map(r => [r.staff_id, r.acting_for]));
  S.names = nm.data || [];
  if (S.me.is_admin || S.me.is_sickness_logger) {
    const d = await sb.rpc('staff_directory');
    S.directory = d.data || [];
  }
}
async function refresh() {
  try {
    const p = await sb.rpc('claim_profile');
    if (p.error) throw p.error;
    S.me = p.data;
    if (!S.me) return renderNotSetUp();
    await loadAll();
    S.error = null;
  } catch (e) { S.error = e.message || String(e); }
  render();
}
async function call(fn, args, okMsg) {
  const r = await sb.rpc(fn, args);
  if (r.error) { alertBox(r.error.message); return null; }
  closeDlg();
  await refresh();
  if (okMsg) flash(okMsg);
  return r.data ?? true;
}
function flash(msg) {
  const el = document.createElement('div');
  el.className = 'banner'; el.setAttribute('role', 'status');
  el.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;background:var(--ok-bg);color:var(--ok)';
  el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 3500);
}
function alertBox(msg) {
  const box = $('dlgBody').querySelector('.dlg-error');
  if ($('dlg').open && box) { box.textContent = msg; box.classList.remove('hidden'); return; }
  S.error = msg; render();
}

// ============================================================
// Sign in
// ============================================================
function renderSignIn(sent) {
  $('tabs').innerHTML = ''; $('who').innerHTML = '';
  $('app').innerHTML = `
  <div class="narrow card">
    <h1>Sign in</h1>
    ${sent ? `<p>Check your email for a sign-in link. You can close this tab and use the link.</p>` : `
    <p class="muted">Enter your school email address and we will send you a sign-in link.</p>
    <form id="signin">
      <div class="field"><label for="em">Email address</label><input id="em" type="email" required autocomplete="email"></div>
      <div id="sierr" class="error hidden"></div>
      <button class="btn primary wide" type="submit">Send sign-in link</button>
    </form>`}
  </div>`;
  if (sent) return;
  $('signin').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('em').value.trim().toLowerCase();
    if (ALLOWED_EMAIL_DOMAIN && !email.endsWith('@' + ALLOWED_EMAIL_DOMAIN)) {
      $('sierr').textContent = 'Please use your @' + ALLOWED_EMAIL_DOMAIN + ' address.'; $('sierr').classList.remove('hidden'); return;
    }
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) { $('sierr').textContent = error.message; $('sierr').classList.remove('hidden'); return; }
    renderSignIn(true);
  };
}
function renderNotSetUp() {
  $('tabs').innerHTML = '';
  $('who').innerHTML = `<button id="so">Sign out</button>`; $('so').onclick = signOut;
  $('app').innerHTML = `<div class="narrow card"><h1>Not set up yet</h1>
    <p>You have signed in, but you have not been added to the Time Off app yet. Please ask your line manager to add you, then sign in again.</p></div>`;
}
async function signOut() { await sb.auth.signOut(); S.me = null; renderSignIn(false); }

// ============================================================
// Layout
// ============================================================
function pendingForMe() {
  const reqs = S.requests.filter(r => ['pending','under_discussion','cancel_requested'].includes(r.status)
    && r.staff_id !== S.me.id && (actingFor(r.staff_id) || (r.status === 'cancel_requested' && S.me.is_admin)));
  const mine = reqs.filter(r => {
    if (r.status !== 'pending') return true;
    const a = actingFor(r.staff_id);
    return !S.decisions.some(d => d.request_id === r.id && d.approver_id === a);
  });
  const hrs = S.hours.filter(h => h.status === 'pending' && h.staff_id !== S.me.id && (actingFor(h.staff_id) || S.me.is_admin));
  return { reqs: mine, hrs };
}
function render() {
  if (!S.me) return;
  const tabs = [['home', 'My time off']];
  const p = pendingForMe();
  if (S.me.is_approver || p.reqs.length || p.hrs.length) tabs.push(['approvals', `Approvals (${p.reqs.length + p.hrs.length})`]);
  if (S.me.has_team || myTeam().length) tabs.push(['calendar', 'Team calendar']);
  if (S.me.is_admin) { tabs.push(['team', 'Team']); tabs.push(['settings', 'Settings']); }
  if (!tabs.some(t => t[0] === S.view)) S.view = 'home';
  $('tabs').innerHTML = tabs.map(([k, t]) => `<button data-v="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${t}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.view = b.dataset.v; render(); window.scrollTo(0, 0); });
  $('who').innerHTML = `${esc(S.me.full_name)} <button id="so">Sign out</button>`; $('so').onclick = signOut;
  const err = S.error ? `<div class="error" role="alert">${esc(S.error)}</div>` : '';
  S.error = null;
  const views = { home: viewHome, approvals: viewApprovals, calendar: viewCalendar, team: viewTeam, settings: viewSettings };
  $('app').innerHTML = err + views[S.view]();
  bind();
}
// Buttons declare what they do with data-act; one handler wires them all
function bind() {
  $('app').querySelectorAll('[data-act]').forEach(el => {
    el.onclick = (e) => { e.preventDefault(); ACTIONS[el.dataset.act](el.dataset.id, el); };
  });
}

// ============================================================
// My time off
// ============================================================
function viewHome() {
  const me = S.me, yr = leaveYear(todayIso());
  let out = `<div class="narrow">`;
  if (me.contract_type === 'year_round') {
    const L = leaveSummary(me, yr);
    const w = (x) => L.allowance ? Math.min(100, x / L.allowance * 100) : 0;
    out += `<section class="card">
      <div class="eyebrow">Annual leave ${yearLabel(yr)}</div>
      <div><span class="big">${num(L.left)}</span> <span class="muted">${L.left === 1 ? 'day' : 'days'} left of ${num(L.allowance)}</span></div>
      <div class="bar" aria-hidden="true"><div class="a" style="width:${w(L.approved)}%"></div><div class="p" style="width:${w(L.waiting)}%"></div></div>
      <span class="key"><i style="background:var(--blue)"></i>${num(L.approved)} approved</span>
      <span class="key"><i style="background:#9fb0cc"></i>${num(L.waiting)} waiting</span>
      <p class="small muted" style="margin:8px 0 0">${pace(L.booked, L.allowance, yr)}. Your leave resets on 1st August.</p>
      <div style="margin-top:16px"><button class="btn primary wide" data-act="newLeave">Request leave</button></div>
      <div class="btnrow">
        <button class="btn" data-act="newFlex">Request one-off flex</button>
        <button class="btn" data-act="newSick">Record sickness</button>
        ${me.kit_from ? `<button class="btn" data-act="newKit">Request a KIT day</button>` : ''}
      </div>
    </section>`;
  } else {
    const H = hoursSummary(me, yr);
    const w = (x) => H.target ? Math.min(100, x / H.target * 100) : 0;
    out += `<section class="card">
      <div class="eyebrow">Extra hours ${yearLabel(yr)}</div>
      <div><span class="big">${num(H.logged)}</span> <span class="muted">of ${num(H.target)} hours logged</span></div>
      <div class="bar" aria-hidden="true"><div class="a" style="width:${w(H.approved)}%"></div><div class="p" style="width:${w(H.waiting)}%"></div></div>

        <button class="btn" data-act="newFlex">Request one-off flex</button>

        ${me.kit_from ? `<button class="btn" data-act="newKit">Request a KIT day</button>` : ''}
      </div>
    </section>`;
  }
  if (me.kit_from) {
    const used = S.requests.filter(r => r.staff_id === me.id && r.kind === 'kit' && r.start_date >= me.kit_from && LIVE.includes(r.status))
      .reduce((t, r) => t + Number(r.days), 0);
    out += `<section class="card"><div class="eyebrow">Keeping in touch days</div>
      <p style="margin:6px 0 0">${num(used)} of ${num(me.kit_allowance)} used. Any work on a day counts as a whole KIT day.</p></section>`;
  }
  if (me.is_sickness_logger || me.is_admin) {
    out += `<section class="card"><h2>For colleagues</h2><button class="btn" data-act="newSickFor">Record sickness for a colleague</button></section>`;
  }
  // My requests
  const mine = S.requests.filter(r => r.staff_id === me.id).sort((a, b) => b.start_date.localeCompare(a.start_date));
  out += `<section class="card"><h2>Your requests</h2>`;
  if (!mine.length) out += `<p class="muted">Nothing yet.</p>`;
  out += `<div class="list">` + mine.slice(0, 30).map(r => {
    const detail = r.kind === 'flex' ? plural(r.hours, 'hour', 'hours') + ' away'
      : r.part !== 'full' ? 'Half day (' + (r.part === 'am' ? 'morning' : 'afternoon') + ')' : plural(r.days, 'day', 'days');
    const canCancel = ['pending','under_discussion','approved'].includes(r.status) && r.end_date >= todayIso();
    return `<div class="item"><div><div>${esc(fmtRange(r.start_date, r.end_date))}</div>
      <div class="small muted">${KIND[r.kind]} · ${detail}${r.status === 'approved' && r.treatment ? ' · ' + treatLabel(r.treatment) : ''}</div>
      ${canCancel ? `<a href="#" class="small" data-act="cancelReq" data-id="${r.id}">Cancel</a>` : ''}</div>${statusChip(r.status)}</div>`;
  }).join('') + `</div></section>`;
  // My hours
  if (me.contract_type === 'term_time_plus') {
    const hrs = S.hours.filter(h => h.staff_id === me.id).sort((a, b) => b.work_date.localeCompare(a.work_date));
    out += `<section class="card"><h2>Recent hours</h2>${hrs.length ? '' : '<p class="muted">Nothing logged yet.</p>'}<div class="list">` +
      hrs.slice(0, 30).map(h => `<div class="item"><div><div>${esc(fmtDate(h.work_date))} · ${plural(h.hours, 'hour', 'hours')}</div>
        <div class="small muted">${esc(h.description)}</div>${h.term_day ? '<span class="tag">Term day</span>' : ''}</div>${statusChip(h.status)}</div>`).join('') +
      `</div></section>`;
  }
  const sick = S.sickness.filter(k => k.staff_id === me.id).sort((a, b) => b.start_date.localeCompare(a.start_date));
  if (sick.length) {
    out += `<section class="card"><h2>Sickness recorded</h2><div class="list">` + sick.slice(0, 20).map(k =>
      `<div class="item"><div>${esc(fmtRange(k.start_date, k.end_date))}${k.part !== 'full' ? ' (half day)' : ''}</div></div>`).join('') + `</div></section>`;
  }
  return out + `</div>`;
}

function openDlg(html, onSubmit) {
  $('dlgBody').innerHTML = html + `<div class="dlg-error error hidden" role="alert"></div>`;
  $('dlg').showModal();
  const f = $('dlgBody').querySelector('form');
  f.onsubmit = async (e) => { e.preventDefault(); const b = f.querySelector('[type=submit]'); b.disabled = true; await onSubmit(f); b.disabled = false; };
  f.querySelector('[data-close]')?.addEventListener('click', (e) => { e.preventDefault(); closeDlg(); });
  return f;
}
function closeDlg() { if ($('dlg').open) $('dlg').close(); }
const formEnd = (label) => `<div class="btnrow"><button class="btn" data-close>Back</button><button class="btn primary" type="submit">${label}</button></div>`;
const dateRangeFields = (withPart) => `
  <div class="row2"><div class="field"><label for="fs">From</label><input id="fs" name="s" type="date" required></div>
  <div class="field"><label for="fe">To</label><input id="fe" name="e" type="date" required></div></div>
  ${withPart ? `<div class="field"><label for="fp">Full or half day</label><select id="fp" name="p">
    <option value="full">Full days</option><option value="am">Half day: morning</option><option value="pm">Half day: afternoon</option></select>
    <span class="hint">A half day must be a single date.</span></div>` : ''}
  <p class="small muted" id="calc" aria-live="polite"></p>`;
function wireRange(f, show) {
  const upd = () => {
    if (f.s.value && (!f.e.value || f.e.value < f.s.value)) f.e.value = f.s.value;
    if (f.p && f.p.value !== 'full') f.e.value = f.s.value;
    $('calc').textContent = f.s.value ? show(f.s.value, f.e.value, f.p ? f.p.value : 'full') : '';
  };
  ['s', 'e'].forEach(k => f[k].addEventListener('change', upd)); f.p?.addEventListener('change', upd);
}

function decide(id, decision, el) {
  const r = S.requests.find(x => x.id === id);
  let treatment = null;
  if (r.kind === 'term_off' && decision === 'approve' && r.status !== 'cancel_requested') {
    const picked = el.closest('article').querySelector('input[type=radio]:checked');
    if (!picked) { S.error = 'Choose how the time off should be treated before approving.'; render(); return; }
    treatment = picked.value;
  }
  call('decide_request', { p_id: id, p_decision: decision, p_treatment: treatment },
    decision === 'approve' ? 'Approved' : 'Declined');
}
function othersOff(r) {
  // who else in the team is off on any of these days
  const team = myTeam().filter(p => p.id !== r.staff_id).map(p => p.id);
  const names = new Set();
  S.requests.forEach(x => {
    if (!team.includes(x.staff_id) || x.kind === 'flex' || !LIVE.includes(x.status)) return;
    if (x.start_date <= r.end_date && x.end_date >= r.start_date) names.add(nameOf(x.staff_id));
  });
  return [...names];
}
function approvalCard(r) {
  const p = byId(r.staff_id), yr = leaveYear(r.start_date);
  const myId = actingFor(r.staff_id);
  const mineDec = S.decisions.find(d => d.request_id === r.id && d.approver_id === myId);
  const others = S.decisions.filter(d => d.request_id === r.id && d.approver_id !== myId);
  let lines = [];
  if (r.kind === 'flex') {
    const fl = S.requests.filter(x => x.staff_id === r.staff_id && x.kind === 'flex' && x.status === 'approved' && leaveYear(x.start_date) === yr);
    lines.push(`<span class="muted">${esc(p.full_name.split(' ')[0])}'s flex this year: ${plural(fl.length, 'request', 'requests')}, ${plural(fl.reduce((t, x) => t + Number(x.hours), 0), 'hour', 'hours')}</span>`);
  }
  if (r.kind === 'annual_leave') {
    const L = leaveSummary(p, yr);
    lines.push(`<span class="muted">${num(L.left)} days left, counting this request</span>`);
  }
  if (r.over_entitlement) lines.push(`<span class="tag warn">Over allowance: may need to be unpaid</span>`);
  if (r.reason) lines.push(`<span class="muted">Reason: ${esc(r.reason)}</span>`);
  if (r.kind !== 'flex') { const o = othersOff(r); if (o.length) lines.push(`<span class="tag warn">Overlaps with ${esc(o.join(', '))}</span>`); }
  others.forEach(d => lines.push(`<span class="tag ${d.decision === 'approve' ? 'ok' : 'warn'}">${esc(nameOf(d.approver_id))} has ${d.decision}d. Only approvers see this.</span>`));
  if (myId && myId !== S.me.id) lines.push(`<span class="tag">You are deputising for ${esc(nameOf(myId))}</span>`);

  const what = r.kind === 'flex' ? plural(r.hours, 'hour', 'hours') + ' away'
    : r.part !== 'full' ? 'half day (' + (r.part === 'am' ? 'morning' : 'afternoon') + ')' : plural(r.days, 'day', 'days');
  let controls;
  if (r.status === 'cancel_requested') {
    lines.unshift(`<span class="tag warn">Asking to cancel an approved booking that affects pay</span>`);
    controls = `<button class="btn" data-act="decline" data-id="${r.id}">Keep the booking</button><button class="btn primary" data-act="approve" data-id="${r.id}">Approve cancellation</button>`;
  } else if (r.status === 'under_discussion') {
    lines.unshift(`<span class="tag warn">Under discussion: talk to the other approver, then change your decision or decline outright</span>`);
    controls = (mineDec?.decision === 'decline' ? `<button class="btn primary" data-act="approve" data-id="${r.id}">Change my decision to approve</button>`
      : !mineDec ? `<button class="btn primary" data-act="approve" data-id="${r.id}">Approve</button>` : '')
      + `<button class="btn" data-act="outright" data-id="${r.id}">Decline outright</button>`;
  } else {
    controls = `<button class="btn" data-act="decline" data-id="${r.id}">Decline</button><button class="btn primary" data-act="approve" data-id="${r.id}">Approve</button>`;
  }
  const treat = r.kind === 'term_off' && r.status !== 'cancel_requested' ? `<fieldset><legend>If approved, treat as</legend>
    <label class="radio"><input type="radio" name="t-${r.id}" value="unpaid"><span>Unpaid<br><span class="small muted">Flagged in the year-end summary for payroll</span></span></label>
    ${p.contract_type === 'term_time_plus' ? `<label class="radio"><input type="radio" name="t-${r.id}" value="made_up"><span>Made up later<br><span class="small muted">Adds ${num(r.days * p.day_hours)} hours to the year's target</span></span></label>` : ''}
    <label class="radio"><input type="radio" name="t-${r.id}" value="paid_special"><span>Paid special leave<br><span class="small muted">No effect on pay or hours</span></span></label></fieldset>` : '';
  return `<article class="card"><div class="req"><div class="info">
      <span class="eyebrow">${esc(p.full_name)} · ${KIND[r.kind]}</span>
      <span class="title">${esc(fmtRange(r.start_date, r.end_date))} · ${what}</span>${lines.join('')}</div>
      ${treat ? '' : `<div class="btnrow" style="margin:0">${controls}</div>`}</div>
      ${treat ? treat + `<div class="btnrow" style="justify-content:flex-end">${controls}</div>` : ''}</article>`;
}
function viewApprovals() {
  const { reqs, hrs } = pendingForMe();
  let out = `<div class="cols"><div class="main"><h1>Waiting for you</h1>
    <p class="muted">${reqs.length + hrs.length ? plural(reqs.length + hrs.length, 'item', 'items') + ', oldest first.' : 'Nothing is waiting for you.'}</p>`;
  const items = [...reqs.map(r => ({ t: r.created_at, html: approvalCard(r) })),
    ...hrs.map(h => ({ t: h.created_at, html: `<article class="card"><div class="req"><div class="info">
      <span class="eyebrow">${esc(nameOf(h.staff_id))} · Extra hours</span>
      <span class="title">${esc(fmtDate(h.work_date))} · ${plural(h.hours, 'hour', 'hours')}</span>
      <span class="muted">${esc(h.description)}</span>${h.term_day ? '<span class="tag">Term day: check against contractual hours</span>' : ''}</div>
      <div class="btnrow" style="margin:0"><button class="btn" data-act="hoursNo" data-id="${h.id}">Decline</button>
      <button class="btn primary" data-act="hoursYes" data-id="${h.id}">Approve</button></div></div></article>` }))]
    .sort((a, b) => a.t.localeCompare(b.t));
  out += items.map(i => i.html).join('');
  // waiting on someone else
  const waiting = S.requests.filter(r => r.status === 'pending' && actingFor(r.staff_id) && !reqs.includes(r));
  if (waiting.length) out += `<h2 style="margin-top:28px">Waiting for another approver</h2><div class="card list">` + waiting.map(r =>
    `<div class="item"><div>${esc(nameOf(r.staff_id))} · ${KIND[r.kind]}<br><span class="small muted">${esc(fmtRange(r.start_date, r.end_date))}</span></div><span class="chip pending">Pending</span></div>`).join('') + `</div>`;
  out += `</div><aside class="side card"><h2>Team at a glance</h2><div class="list">`;
  const yr = leaveYear(todayIso());
  out += myTeam().map(p => {
    let line, pc;
    if (p.contract_type === 'year_round') { const L = leaveSummary(p, yr); line = `${num(L.left)} of ${num(L.allowance)} days left`; pc = pace(L.booked, L.allowance, yr); }
    else { const H = hoursSummary(p, yr); line = `${num(H.logged)} of ${num(H.target)} hours logged`; pc = pace(H.logged, H.target, yr); }
    return `<div class="item"><div><div>${esc(p.full_name)}</div><div class="small muted">${line}</div></div>
      <span class="${pc === 'On track' ? 'small muted' : 'tag'}">${pc}</span></div>`;
  }).join('') + `</div>${S.me.is_admin ? '<p><a href="#" data-act="exportYear">Download year-end summary</a></p>' : ''}</aside></div>`;
  return out;
}

// Team calendar
// ============================================================
function monthDays(ym) {
  const [y, m] = ym.split('-').map(Number);
  const out = []; for (let d = iso(new Date(Date.UTC(y, m - 1, 1, 12))); toDate(d).getUTCMonth() === m - 1; d = addDays(d, 1)) if (isWeekday(d)) out.push(d);
  return out;
}
function cellFor(pid, d) {
  const sick = S.sickness.find(k => k.staff_id === pid && d >= k.start_date && d <= k.end_date);
  if (sick) return ['c-absent', 'Absent'];
  const r = S.requests.find(x => x.staff_id === pid && x.kind !== 'flex' && LIVE.includes(x.status) && d >= x.start_date && d <= x.end_date);
  if (r && !isBH(d)) {
    if (r.status === 'pending' || r.status === 'under_discussion') return ['c-pending', KIND[r.kind] + ', waiting for approval'];
    if (r.part !== 'full') return ['c-half', KIND[r.kind] + ', half day'];
    return ['c-leave', KIND[r.kind]];
  }
  if (isBH(d)) return ['c-bh', 'Bank holiday'];
  const h = S.hours.find(x => x.staff_id === pid && x.work_date === d && x.status !== 'declined');
  const fl = S.requests.find(x => x.staff_id === pid && x.kind === 'flex' && LIVE.includes(x.status) && x.start_date === d);
  const cls = (h ? 'c-hours' : isTermDay(d) ? 'c-term' : '') + (fl ? ' c-flex' : '');
  const lab = [h ? 'Working extra hours' : '', fl ? 'One-off flex (' + plural(fl.hours, 'hour', 'hours') + ' away)' : ''].filter(Boolean).join(', ');
  return [cls, lab];
}
function viewCalendar() {
  if (!S.month) S.month = todayIso().slice(0, 7);
  const [y, m] = S.month.split('-').map(Number);
  const days = monthDays(S.month), people = myTeam();
  const offOn = {};
  days.forEach(d => people.forEach(p => { const [c] = cellFor(p.id, d); if (/c-(leave|pending|half|absent)/.test(c)) (offOn[d] = offOn[d] || []).push(p.full_name); }));
  const clashes = Object.entries(offOn).filter(([, n]) => n.length > 1);
  let out = `<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:14px"><a href="#" data-act="prevMonth" aria-label="Previous month">Previous</a>
      <h1 style="margin:0">${MONTHS[m - 1]} ${y}</h1><a href="#" data-act="nextMonth" aria-label="Next month">Next</a></div>
    <div class="btnrow" style="margin:0"><button class="btn" data-act="ics">Download calendar file</button></div></div>`;
  out += clashes.map(([d, n]) => `<div class="banner">${n.length} people are off on ${esc(fmtDate(d))}: ${esc(n.join(', '))}.</div>`).join('');
  out += `<div class="card scroll"><div class="cal" style="grid-template-columns:130px repeat(${days.length},minmax(0,1fr))"><span></span>` +
    days.map(d => `<div class="hd"><span>${DAYS[toDate(d).getUTCDay()][0]}</span><b>${toDate(d).getUTCDate()}</b></div>`).join('') +
    people.map(p => `<span class="nm">${esc(p.full_name)}</span>` + days.map(d => {
      const [c, l] = cellFor(p.id, d); return `<div class="cell ${c}" title="${esc(p.full_name + ', ' + fmtDate(d) + (l ? ': ' + l : ''))}"></div>`;
    }).join('')).join('') + `</div>
    <p class="small muted" style="margin:14px 0 0">Weekends are hidden. Lightly shaded days are term time. Sickness shows only as "Absent".</p></div>
    <div class="legend"><span><i class="c-leave"></i>Leave</span><span><i class="c-pending"></i>Waiting for approval</span>
    <span><i class="c-half"></i>Half day</span><span><i class="c-hours"></i>Working extra hours</span><span><i class="c-absent"></i>Absent</span>
    <span><i class="c-flex"></i>One-off flex</span><span><i class="c-bh"></i>Bank holiday</span></div>`;
  if (!people.length) out += `<p class="muted">Nobody is linked to you yet.</p>`;
  return out;
}
function downloadIcs() {
  const team = new Set(myTeam().map(p => p.id));
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const ev = [];
  S.requests.filter(r => team.has(r.staff_id) && r.status === 'approved' && r.kind !== 'flex').forEach(r => {
    ev.push(['tor-' + r.id, r.start_date, addDays(r.end_date, 1), nameOf(r.staff_id) + ': ' + KIND[r.kind] + (r.part !== 'full' ? ' (half day)' : '')]);
  });
  S.sickness.filter(k => team.has(k.staff_id)).forEach(k => ev.push(['tos-' + k.id, k.start_date, addDays(k.end_date, 1), nameOf(k.staff_id) + ': Absent']));
  S.requests.filter(r => team.has(r.staff_id) && r.status === 'approved' && r.kind === 'flex').forEach(r =>
    ev.push(['tof-' + r.id, r.start_date, addDays(r.start_date, 1), nameOf(r.staff_id) + ': One-off flex (' + plural(r.hours, 'hour', 'hours') + ' away)']));
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kings College School//Time Off//EN', 'X-WR-CALNAME:Team time off'];
  ev.forEach(([uid, s, e, t]) => lines.push('BEGIN:VEVENT', 'UID:' + uid + '@timeoff', 'DTSTAMP:' + stamp,
    'DTSTART;VALUE=DATE:' + s.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + e.replace(/-/g, ''),
    'SUMMARY:' + t.replace(/[,;]/g, ' '), 'TRANSP:TRANSPARENT', 'END:VEVENT'));
  lines.push('END:VCALENDAR');
  saveFile('team-time-off.ics', lines.join('\r\n'), 'text/calendar');
}
function saveFile(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

        <td>${r.kind === 'term_off' ? `<select class="treat" aria-label="Treatment"><option value="">Not set</option>${['unpaid','made_up','paid_special'].filter(t => t !== 'made_up' || p.contract_type === 'term_time_plus').map(t => `<option value="${t}" ${r.treatment === t ? 'selected' : ''}>${treatLabel(t)}</option>`).join('')}</select> <a href="#" class="small" data-act="setTreat" data-id="${r.id}">Save</a>` : ''}</td>

      hrs.map(h => `<tr><td>${esc(fmtDate(h.work_date, true))}${h.term_day ? ' <span class="tag">Term day</span>' : ''}</td><td>${num(h.hours)}</td><td>${esc(h.description)}</td><td>${statusChip(h.status)}</td>
      <td>${h.status === 'pending' ? `<a href="#" data-act="hoursYes" data-id="${h.id}">Approve</a> · <a href="#" data-act="hoursNo" data-id="${h.id}">Decline</a> · ` : ''}<a href="#" data-act="delHours" data-id="${h.id}">Delete</a></td></tr>`).join('') + `</tbody></table>` : '<p class="muted">None.</p>'}</div>` : ''}

async function exportYear() {
  const yr = leaveYear(todayIso());

  const rows = r.data.map(x => [x.full_name, x.contract_type === 'year_round' ? 'Year-round' : 'Term time plus', x.allowance ?? '', x.used, x.unpaid_days,
    x.extra_hours_due ?? '', x.extra_hours_approved, x.sickness_days, x.flex_count, x.flex_hours, x.kit_days]);
  const csv = [head, ...rows].map(row => row.map(c => { let v = String(c ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return `"${v.replace(/"/g, '""')}"`; }).join(',')).join('\r\n');
  saveFile(`time-off-summary-${yearLabel(yr)}.csv`, '﻿' + csv, 'text/csv');
}
